<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#FDFCF8"><title>Customers | Adeel Mobile Installments</title>
<link rel="stylesheet" href="../../../css/main.css"><link rel="stylesheet" href="../../../css/components.css"><link rel="stylesheet" href="../../../css/admin.css"><link rel="stylesheet" href="../../../css/admin-customers.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js" defer></script><script src="../../../js/config/supabase.js" defer></script><script src="../../../js/modules/auth/auth.js" defer></script><script src="../../../js/modules/admin/customers.js" defer></script></head>
<body data-required-role="admin" hidden><main class="admin-page"><div class="admin-shell"><header class="admin-header"><a class="admin-brand admin-brand-link" href="/pages/admin/dashboard/"><div class="brand-mark">AM</div><div><strong>Adeel Mobile</strong><span>Installments · Admin</span></div></a><div class="admin-actions"><a class="admin-back" href="/pages/admin/dashboard/">Dashboard</a><button class="admin-signout" id="logout-button" type="button">Sign out</button></div></header>
<section class="admin-content"><p class="admin-eyebrow">Admin workspace</p><h1>Customers</h1><p class="admin-intro">Customer directory, contact details and installment account overview.</p>
<div class="customer-toolbar"><div><strong id="customer-count">Customers</strong><p>Search, add and update customer records.</p></div><button class="customer-primary" id="add-customer" type="button">＋ Add customer</button></div>
<div class="customer-filters"><input id="customer-search" type="search" placeholder="Search name, phone or CNIC" aria-label="Search customers"><select id="customer-status" aria-label="Customer status"><option value="all">All statuses</option><option value="active">Active</option><option value="inactive">Inactive</option></select><button class="customer-secondary" id="refresh-customers" type="button">Refresh</button></div>
<p id="customer-message" class="customer-message" role="status" hidden></p><div id="customer-list" class="customer-list">Loading customers…</div></section></div></main>
<dialog id="customer-dialog" class="customer-dialog"><form id="customer-form"><div class="dialog-heading"><div><p class="admin-eyebrow">Customer record</p><h2 id="customer-dialog-title">Add customer</h2></div><button type="button" class="dialog-close" id="close-customer">×</button></div><input id="customer-id" type="hidden">
<div class="customer-form-grid"><label>Customer name *<input id="customer-name" required maxlength="120"></label><label>Phone *<input id="customer-phone" required maxlength="30" inputmode="tel"></label><label>WhatsApp<input id="customer-whatsapp" maxlength="30" inputmode="tel"></label><label>CNIC<input id="customer-cnic" maxlength="20" placeholder="00000-0000000-0"></label><label class="full-field">Address *<textarea id="customer-address" required maxlength="500" rows="2"></textarea></label><label>Category<select id="customer-category"><option value="approved">Approved</option><option value="pending">Pending</option><option value="repeat_customer">Repeat customer</option><option value="rejected">Rejected</option></select></label><label>Status<select id="customer-state"><option value="active">Active</option><option value="inactive">Inactive</option></select></label><label class="full-field">Notes<textarea id="customer-notes" rows="2" maxlength="1000"></textarea></label></div>
<p id="customer-form-message" class="customer-message" role="alert" hidden></p><div class="dialog-actions"><button type="button" class="customer-secondary" id="cancel-customer">Cancel</button><button class="customer-primary" id="save-customer" type="submit">Save customer</button></div></form></dialog>
</body></html>
