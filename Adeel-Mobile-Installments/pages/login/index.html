<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FDFCF8">
  <meta name="description" content="Secure sign in to Adeel Mobile Installments.">
  <title>Sign In | Adeel Mobile Installments</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
      <header class="auth-brand">
        <div class="brand-mark" aria-hidden="true">AM</div>
        <p class="brand-name">Adeel Mobile</p>
        <p class="brand-subtitle">Installments</p>
      </header>

      <div class="auth-heading">
        <h1 id="login-title">Welcome back</h1>
        <p>Sign in to continue to your account</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="Enter your username"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          >
        </div>

        <div class="form-field">
          <label for="password">4-digit password</label>
          <div class="password-control">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter 4-digit password"
              inputmode="numeric"
              autocomplete="current-password"
              pattern="[0-9]{4}"
              minlength="4"
              maxlength="4"
              required
            >
            <button class="password-toggle" id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">
              Show
            </button>
          </div>
          <p class="field-hint">Your password must contain exactly 4 digits.</p>
        </div>

        <div class="form-options">
          <label class="remember-option" for="remember-me">
            <input id="remember-me" name="rememberMe" type="checkbox">
            <span>Remember me</span>
          </label>
          <a class="text-link" href="#" id="forgot-password">Forgot password?</a>
        </div>

        <p class="form-message" id="login-message" role="alert" aria-live="polite" hidden></p>

        <button class="primary-button" id="login-button" type="submit">
          <span class="button-label">Sign In</span>
        </button>
      </form>

      <footer class="auth-footer">
        <p>Secure access for authorized Admins and Users</p>
        <p class="security-note">Never share your password with anyone.</p>
      </footer>
    </section>
  </main>

<script src="../../js/components/ui.js" defer></script>
  <script src="../../js/modules/auth/login.js" defer></script>
</body>
</html>
