<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FDFCF8">
  <meta name="description" content="Secure sign in for authorized Adeel Mobile Installments users.">
  <title>Sign In | Adeel Mobile Installments</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/components.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js" defer></script>
  <script src="../../js/config/supabase.js" defer></script>
  <script src="../../js/modules/auth/auth.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
      <header class="auth-brand">
        <div class="brand-mark" aria-hidden="true">AM</div>
        <p class="brand-name">Adeel Mobile</p>
        <p class="brand-subtitle">Installments</p>
      </header>

      <div class="auth-heading">
        <h1 id="login-title">Welcome back</h1>
        <p>Sign in with your authorized account to continue.</p>
      </div>

      <form id="login-form" novalidate>
        <div id="login-message" class="form-message" role="alert" aria-live="polite" hidden></div>

        <div class="form-field">
          <label for="email">Email or username</label>
          <input id="email" name="email" type="text" autocomplete="username" inputmode="text" placeholder="Enter email or username" required>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <div class="password-control">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="password-toggle" id="password-toggle" type="button" aria-label="Show password">Show</button>
          </div>
        </div>

        <button class="primary-button" type="submit">Sign in</button>
      </form>

      <footer class="auth-footer">
        <p>Secure access for authorized Admins and Users</p>
        <p class="security-note">Never share your password or verification codes with anyone.</p>
      </footer>
    </section>
  </main>
</body>
</html>
