<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FDFCF8">
  <meta name="robots" content="noindex, nofollow">
  <title>Choose a New Password | Adeel Mobile Installments</title>
  <link rel="stylesheet" href="../../../css/main.css">
  <link rel="stylesheet" href="../../../css/components.css">
  <script type="module" src="./reset-password.js"></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="reset-title">
      <header class="auth-brand">
        <div class="brand-mark" aria-hidden="true">AM</div>
        <p class="brand-name">Adeel Mobile</p>
        <p class="brand-subtitle">Installments</p>
      </header>
      <div class="auth-heading">
        <h1 id="reset-title">Choose a new password</h1>
        <p>Set a new password for your authorized account.</p>
      </div>
      <form id="reset-form" novalidate hidden>
        <div class="form-field">
          <label for="new-password">New password</label>
          <div class="password-control">
            <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
            <button class="password-toggle" id="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="form-field">
          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter the same password again">
        </div>
        <p id="reset-message" class="form-message" role="status" aria-live="polite" hidden></p>
        <button class="primary-button" id="reset-submit" type="submit">Update password</button>
      </form>
      <p id="reset-status" class="form-message" role="status" aria-live="polite">Verifying your secure recovery link…</p>
      <footer class="auth-footer">
        <p><a class="text-link" href="/pages/login/">Back to sign in</a></p>
        <p class="security-note">Never share your password or recovery link with anyone.</p>
      </footer>
    </section>
  </main>
</body>
</html>
