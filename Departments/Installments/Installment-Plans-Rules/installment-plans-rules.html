<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adeel Mobile - Plans & Rules</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/layout.css">
  <link rel="stylesheet" href="installment-plans-rules.css">
</head>
<body>
  <main id="page-content" class="ip-page">
    <h2 class="ip-title">🧮 Installment Plans & Rules</h2>

    <section class="ip-box">
      <label class="ip-label">📱 Item ka naam (zaroori nahi)
        <input class="ip-input" id="itemName" type="text" placeholder="Jaise Samsung A15">
      </label>
      <label class="ip-label">💵 Qeemat (Rs)
        <input class="ip-input" id="price" type="number" inputmode="numeric" min="0" placeholder="Jaise 80000">
      </label>
      <div class="ip-label">📆 Mahine</div>
      <div class="ip-chips" id="months"></div>
    </section>

    <div class="ip-note" id="note" hidden></div>

    <section class="ip-cards">
      <div class="ip-card"><div class="ip-cl">💵 Advance</div><div class="ip-num" id="c-adv">Rs 0</div><div class="ip-hint" id="h-adv">—</div></div>
      <div class="ip-card"><div class="ip-cl">⏳ Baqi</div><div class="ip-num" id="c-bal">Rs 0</div><div class="ip-hint">Qeemat − Advance</div></div>
      <div class="ip-card"><div class="ip-cl">📈 Markup</div><div class="ip-num" id="c-mk">Rs 0</div><div class="ip-hint" id="h-mk">—</div></div>
      <div class="ip-card"><div class="ip-cl">🗓️ Mahana Qist</div><div class="ip-num" id="c-mon">Rs 0</div><div class="ip-hint" id="h-mon">—</div></div>
    </section>

    <button class="ip-save" id="saveBtn" disabled>💾 Plan Save Karein</button>

    <h3 class="ip-sub">📊 Teeno plans ek nazar mein</h3>
    <div class="ip-scroll">
      <table class="ip-table">
        <thead><tr><th>Mahine</th><th>Mahana</th><th>Kul Raqam</th></tr></thead>
        <tbody id="allPlans"></tbody>
      </table>
    </div>

    <h3 class="ip-sub">📜 Rules</h3>
    <div class="ip-scroll">
      <table class="ip-table">
        <thead><tr><th>Rule</th><th>Qeemat</th></tr></thead>
        <tbody id="rulesBody"></tbody>
      </table>
    </div>

    <h3 class="ip-sub">🗂️ Save kiye hue plans (aakhri 10)</h3>
    <ul class="ip-list" id="saved"><li>⏳ Load ho raha hai...</li></ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../../../js/supabase-config.js"></script>
  <script src="../../../js/auth.js"></script>
  <script src="../../../js/sidebar.js" data-root="../../../" data-active="inst-plans"></script>
  <script src="../Shared-Core/installment-rules.js"></script>
  <script src="../Shared-Core/installment-calculator.js"></script>
  <script src="installment-plans-rules.js"></script>
</body>
</html>
