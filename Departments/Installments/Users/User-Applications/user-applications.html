<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Applications</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../css/theme.css">
<link rel="stylesheet" href="../../../../css/layout.css">
<link rel="stylesheet" href="user-applications.css">
</head>
<body>

<main id="page-content">
  <a class="ap-back" id="backLink" href="../users.html">⬅️ Back</a>
  <h1 class="ap-title">📝 User Applications</h1>
  <div class="ap-user" id="apUser"></div>

  <div id="apMsg" class="ap-empty">⏳ Loading...</div>

  <div id="apBox" hidden>
    <div class="ap-stats">
      <div class="ap-stat"><span>📋 Total</span><b id="sumAll">0</b></div>
      <div class="ap-stat"><span>⏳ Pending</span><b id="sumPending">0</b></div>
      <div class="ap-stat"><span>✅ Approved</span><b id="sumApproved">0</b></div>
      <div class="ap-stat"><span>❌ Rejected</span><b id="sumRejected">0</b></div>
    </div>

    <div class="ap-filters">
      <button class="ap-fbtn active" data-f="all" type="button">All</button>
      <button class="ap-fbtn" data-f="pending" type="button">Pending</button>
      <button class="ap-fbtn" data-f="approved" type="button">Approved</button>
      <button class="ap-fbtn" data-f="rejected" type="button">Rejected</button>
    </div>

    <div id="apList"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../../../js/supabase-config.js"></script>
<script src="../../../../js/auth.js"></script>
<script src="../../../../js/sidebar.js" data-root="../../../../" data-active="inst-users"></script>
<script src="user-applications.js"></script>
</body>
</html>
