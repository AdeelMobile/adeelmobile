<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Login & Access</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../css/theme.css">
<link rel="stylesheet" href="../../../../css/layout.css">
<link rel="stylesheet" href="user-login-access.css">
</head>
<body>

<main id="page-content">
  <a class="lg-back" id="backLink" href="../users.html">Back</a>
  <h1 class="lg-title">Login & Access</h1>
  <div class="lg-user" id="lgUser"></div>

  <div id="lgMsg" class="lg-empty">Loading...</div>

  <div id="lgBox" hidden>

    <div id="secCreate" class="lg-card" hidden>
      <h2 class="lg-sub">Create Login</h2>
      <div class="lg-note">This user has no login yet.</div>

      <label class="lg-lbl" for="cUser">Username</label>
      <input class="lg-input" id="cUser" type="text" autocapitalize="none" autocomplete="off">

      <label class="lg-lbl" for="cPass">Password</label>
      <input class="lg-input" id="cPass" type="text" autocomplete="off" placeholder="At least 6 characters">

      <button class="lg-main-btn" id="createBtn" type="button">Create Login</button>
    </div>

    <div id="secManage" hidden>
      <div class="lg-card">
        <h2 class="lg-sub">Login Details</h2>
        <div class="lg-line">Username: <b id="mUser"></b></div>
        <div class="lg-note">This login is for the user app. It cannot open the admin panel.</div>
      </div>

      <div class="lg-card">
        <h2 class="lg-sub">Reset Password</h2>
        <label class="lg-lbl" for="rPass">New Password</label>
        <input class="lg-input" id="rPass" type="text" autocomplete="off" placeholder="At least 6 characters">
        <button class="lg-main-btn" id="resetBtn" type="button">Change Password</button>
      </div>

      <div class="lg-card">
        <h2 class="lg-sub">Remove Login</h2>
        <div class="lg-note">The user will no longer be able to sign in. You can create a new login later.</div>
        <button class="lg-btn" id="removeBtn" type="button">Remove Login</button>
      </div>
    </div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../../../js/supabase-config.js"></script>
<script src="../../../../js/auth.js"></script>
<script src="../../../../js/sidebar.js" data-root="../../../../" data-active="inst-users"></script>
<script src="user-login-access.js"></script>
</body>
</html>
