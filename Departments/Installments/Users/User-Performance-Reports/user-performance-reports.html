<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Performance Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../css/theme.css">
<link rel="stylesheet" href="../../../../css/layout.css">
<link rel="stylesheet" href="user-performance-reports.css">
</head>
<body>

<main id="page-content">
  <a class="pr-back" id="backLink" href="../users.html">Back</a>
  <h1 class="pr-title">Performance Report</h1>
  <div class="pr-user" id="prUser"></div>

  <div id="prMsg" class="pr-empty">Loading...</div>

  <div id="prBox" hidden>
    <label class="pr-lbl" for="fMonth">Month</label>
    <input class="pr-input" id="fMonth" type="month">

    <h2 class="pr-sub">Sales vs Target</h2>
    <div class="pr-stats">
      <div class="pr-stat"><span>Sales</span><b id="sSales">Rs 0</b></div>
      <div class="pr-stat"><span>Target</span><b id="sTarget">Rs 0</b></div>
      <div class="pr-stat"><span>Achieved</span><b id="sPct">0%</b></div>
      <div class="pr-stat"><span>Remaining</span><b id="sRemain">Rs 0</b></div>
    </div>
    <div class="pr-bar"><div class="pr-fill" id="prFill"></div></div>
    <div class="pr-note" id="prNote"></div>

    <h2 class="pr-sub">Applications</h2>
    <div class="pr-stats">
      <div class="pr-stat"><span>Total</span><b id="aTotal">0</b></div>
      <div class="pr-stat"><span>Pending</span><b id="aPending">0</b></div>
      <div class="pr-stat"><span>Approved</span><b id="aApproved">0</b></div>
      <div class="pr-stat"><span>Rejected</span><b id="aRejected">0</b></div>
    </div>

    <h2 class="pr-sub">Monthly History</h2>
    <div id="prList"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../../../js/supabase-config.js"></script>
<script src="../../../../js/auth.js"></script>
<script src="../../../../js/sidebar.js" data-root="../../../../" data-active="inst-users"></script>
<script src="user-performance-reports.js"></script>
</body>
</html>
