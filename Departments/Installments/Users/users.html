<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adeel Mobile - Users Management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../../css/theme.css">
  <link rel="stylesheet" href="../../../css/layout.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #F8F9FA;
      color: #111;
      -webkit-font-smoothing: antialiased;
    }

    .page { padding: 20px 16px 40px; max-width: 600px; margin: auto; min-height: 100vh; }

    .title { font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 20px; }

    /* Department Card Styling */
    .department-box {
      background: #fff;
      border: 1px solid #e1e5eb;
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .department-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .department-header:hover { background: #f9f9f9; }

    .department-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 600;
    }

    .icon-header {
      width: 40px;
      height: 40px;
      background: #f0f0f0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .arrow {
      font-size: 14px;
      color: #666;
      transition: transform 0.3s ease;
    }

    /* Expandable Content (Grid - 3 Columns) */
    .department-content {
      display: none; 
      padding: 0 18px 18px 18px;
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px; 
    }

    .department-content.open {
      display: grid; 
    }

    /* Sub Buttons */
    .sub-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #E8E8E8; 
      border: 1px solid #E0E0E0;
      padding: 14px 6px; 
      border-radius: 10px;
      text-decoration: none;
      color: #111;
      font-family: 'Inter', sans-serif;
      font-size: 13px; 
      font-weight: 700;
      transition: background 0.2s;
      text-align: center;
    }
    
    .sub-btn:hover {
      background: #DCDCDC; 
    }

    .sub-btn-icon {
      font-size: 24px; 
      display: flex;
      align-items: center;
      justify-content: center;
      height: 30px;
    }

    .department-box.active .arrow {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>

  <main id="page-content" class="page">
    
    <h2 class="title">User Management</h2>

    <!-- Users Box -->
    <div class="department-box active">
      <div class="department-header" onclick="toggleAccordion(this)">
        <div class="department-title">
          <div class="icon-header">👥</div> Users Options
        </div>
        <div class="arrow">▼</div>
      </div>
      
      <!-- Yahan aapke working links hain -->
      <div class="department-content open">
        <a href="Create-New-User/create-new-user.html" class="sub-btn"><span class="sub-btn-icon">👤</span> Create User</a>
        <a href="All-Users-List/all-users.html" class="sub-btn"><span class="sub-btn-icon">📋</span> All Users</a>
        <a href="Verifications/verifications.html" class="sub-btn"><span class="sub-btn-icon">✔️</span> Verifications</a>
        <a href="User-Wallet-Earnings/user-wallet-earnings.html" class="sub-btn"><span class="sub-btn-icon">💼</span> Wallet</a>
        <a href="User-Sales-Reports/user-sales-reports.html" class="sub-btn"><span class="sub-btn-icon">📊</span> Sales Report</a>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../../../js/supabase-config.js"></script>
  <script src="../../../js/auth.js"></script>
  <script src="../../../js/sidebar.js" data-root="../../../" data-active="inst-users"></script>

  <script>
    function toggleAccordion(element) {
      const box = element.parentElement;
      const content = box.querySelector('.department-content');
      box.classList.toggle('active');
      content.classList.toggle('open');
    }
  </script>
</body>
</html>
