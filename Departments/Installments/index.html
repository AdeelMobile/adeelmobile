<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adeel Mobile - Installments Department</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- CSS Paths (2 folders peechay) -->
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/layout.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #F8F9FA;
      color: #111;
      -webkit-font-smoothing: antialiased;
    }

    .us-page { 
      padding: 6vw 4vw 10vw; 
      max-width: 1100px; 
      margin: auto; 
      min-height: 100vh;
    }
    
    /* Top Bar Styling */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #e1e5eb;
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:hover { background: #f0f7ff; }

    .overview-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid #e1e5eb;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #2563eb;
      text-decoration: none;
      transition: all 0.2s;
    }
    .overview-btn:hover { background: #f0f7ff; }
    .overview-btn span { filter: grayscale(100%) brightness(0); } 

    .logout-btn {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ddd;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .logout-btn:hover { background: #e0e0e0; }

    /* Search Bar */
    .search-container {
      position: relative;
      margin-bottom: 28px;
    }

    .search-input {
      width: 100%;
      padding: 16px 16px 16px 48px;
      border: 1px solid #e1e5eb;
      border-radius: 12px;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
      background: #fff;
      outline: none;
    }
    .search-input:focus { border-color: #2563eb; }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #000;
      font-size: 18px;
    }

    /* Heading */
    .us-title { 
      font-family: 'Inter', sans-serif;
      font-size: clamp(24px, 6.5vw, 32px);
      font-weight: 700; 
      line-height: 1.3; 
      margin: 0 0 24px; 
      color: #111; 
      letter-spacing: -0.02em;
    }
    
    .us-module-grid { 
      display: grid; 
      grid-template-columns: 1fr; 
      gap: 14px; 
    }
    
    /* Button / Card Styling */
    .us-module { 
      display: flex; 
      align-items: center; 
      gap: 14px; 
      width: 100%; 
      min-height: 70px;
      padding: 14px; 
      text-align: left; 
      border: 1px solid #e1e5eb; 
      border-radius: 14px; 
      background: #fff; 
      color: #111; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      text-decoration: none; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    
    .us-module:hover { 
      border-color: #2563eb; 
      transform: translateY(-1px); 
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
    }
    
    .us-module-icon { 
      flex: 0 0 46px; 
      width: 46px; 
      height: 46px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: #f0f0f0;
      border-radius: 12px; 
      font-size: 22px;
      color: #000;
    }
    
    .us-module-text { min-width: 0; flex: 1; }
    
    .us-module-name { 
      font-family: 'Roboto', sans-serif;
      font-size: 17px;
      line-height: 1.4; 
      font-weight: 500; 
      display: block; 
      color: #111;
    }
    
    .us-footer { 
      margin-top: 35px; 
      font-size: 13px; 
      color: #888; 
      text-align: center; 
      line-height: 1.5;
    }

    @media (min-width: 700px) { 
      .us-page { padding: 30px 24px 50px; } 
      .us-module-grid { grid-template-columns: repeat(2, 1fr); }
      .us-module { padding: 18px; gap: 16px; }
      .us-module-icon { flex: 0 0 50px; width: 50px; height: 50px; font-size: 24px; }
      .us-module-name { font-size: 18px; }
    }
  </style>
</head>

<body>
  <main id="page-content" class="us-page">

    <!-- Top Bar -->
    <div class="top-bar">
        <div id="sidebar-toggle-container"></div>

        <div class="header-actions">
            <div class="icon-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            </div>
            
            <a href="../../Main-Dashboard/main-dashboard.html" class="overview-btn">
                <span>📊</span> Overview
            </a>

            <a href="../../index.html" class="logout-btn">Logout</a>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" placeholder="Search...">
    </div>

    <!-- Heading -->
    <h2 class="us-title">Installments Department</h2>

    <section class="us-module-grid">
      
      <!-- Users Button -->
      <a href="../Users/users.html" class="us-module">
        <div class="us-module-icon">👥</div>
        <span class="us-module-text">
          <span class="us-module-name">Users</span>
        </span>
      </a>

      <!-- Customers Button -->
      <a href="Customers/customers.html" class="us-module">
        <div class="us-module-icon">🧑‍💼</div>
        <span class="us-module-text">
          <span class="us-module-name">Customers</span>
        </span>
      </a>

    </section>

    <p class="us-footer">Adeel Mobile Business Software · Installments Department</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/sidebar.js" data-root="../../" data-active="installments"></script>
</body>
</html>
