v<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Information - Adeel Mobile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/layout.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      visibility: hidden;
      font-family: 'Roboto', sans-serif;
      background-color: #F8F9FA;
      color: #111;
      -webkit-font-smoothing: antialiased;
    }

    .topbar, .app-header { display: none !important; }

    /* Top Bar */
    .custom-top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: #fff;
      border-bottom: 1px solid #E5E7EB; gap: 10px; z-index: 100;
    }

    .left-section { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

    .back-btn {
        display: flex; align-items: center; justify-content: center;
        width: 40px; height: 40px;
        background: #fff; border: 1px solid #E5E7EB; 
        border-radius: 10px; cursor: pointer; color: #111; flex-shrink: 0;
        text-decoration: none; font-size: 20px;
    }
    .back-btn:hover { background: #F3F4F6; }

    .title-area {
      font-family: 'Inter', sans-serif; 
      font-size: 20px;
      font-weight: 700; 
      color: #111; 
      white-space: nowrap;
      overflow: hidden; 
      text-overflow: ellipsis;
    }

    /* Main Layout */
    .page { 
      padding: 85px 16px 40px; 
      max-width: 720px; margin: auto; min-height: 100vh; 
    }

    /* Header Box (Grey) */
    .header-box {
      background: #E5E7EB;
      color: #111111;
      border-radius: 12px;
      padding: 20px 16px;
      margin-bottom: 20px;
    }
    
    .header-box .title-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }

    .header-box svg { width: 28px; height: 28px; stroke: #111; }
    
    .header-box h1 {
      font-family: 'Inter', sans-serif;
      font-size: 24px; font-weight: 700; letter-spacing: -0.5px; color: #111;
    }

    .header-box p {
      font-size: 14px; color: #555555; font-weight: 400;
      margin-left: 38px; 
    }

    /* Form Styling */
    .form-container {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 14px;
      padding: 20px;
    }

    .form-section {
      margin-bottom: 24px;
      border-bottom: 1px solid #F3F4F6;
      padding-bottom: 20px;
    }

    .form-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .section-title {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #111;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .section-title svg { width: 20px; height: 20px; stroke: #555; }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #4B5563;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #D1D5DB;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Roboto', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      background: #F9FAFB;
    }

    .form-input:focus {
      border-color: #111;
      background: #FFF;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Save Button */
    .save-btn {
      width: 100%;
      padding: 16px;
      background: #1C1C1C;
      color: #FFF;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .save-btn:hover { background: #333; }
    .save-btn:disabled { background: #999; cursor: not-allowed; }

    .msg-box {
      text-align: center; margin-top: 15px; font-size: 14px; font-weight: 500;
    }

    @media (max-width: 359px) {
      .form-row { grid-template-columns: 1fr; }
      .header-box h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

  <header class="custom-top-bar">
    <div class="left-section">
      <a href="settings.html" class="back-btn">←</a>
      <div class="title-area">Website Settings</div>
    </div>
  </header>

  <main id="page-content" class="page">
    
    <!-- Grey Header -->
    <div class="header-box">
      <div class="title-row">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        <h1>Contact Information</h1>
      </div>
      <p>Manage contact details for your website</p>
    </div>

    <form id="contactForm" class="form-container">
      
      <!-- Phone Numbers Section -->
      <div class="form-section">
        <div class="section-title">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          Phone Numbers
        </div>
        <div class="form-group">
          <label class="form-label">Primary Phone</label>
          <input type="tel" id="primaryPhone" class="form-input" placeholder="e.g. 03001234567">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Secondary Phone</label>
            <input type="tel" id="secondaryPhone" class="form-input" placeholder="e.g. 03211234567">
          </div>
          <div class="form-group">
            <label class="form-label">Landline</label>
            <input type="tel" id="landline" class="form-input" placeholder="e.g. 042-1234567">
          </div>
        </div>
      </div>

      <!-- WhatsApp Section -->
      <div class="form-section">
        <div class="section-title">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          WhatsApp Settings
        </div>
        <div class="form-group">
          <label class="form-label">WhatsApp Number</label>
          <input type="tel" id="waNumber" class="form-input" placeholder="e.g. 03001234567">
        </div>
        <div class="form-group">
          <label class="form-label">Default Message</label>
          <input type="text" id="waMessage" class="form-input" placeholder="e.g. Assalam o Alaikum, mujhe details chahiye">
        </div>
      </div>

      <!-- Email & Address Section -->
      <div class="form-section">
        <div class="section-title">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          Email & Address
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="e.g. info@adeelmobile.com">
        </div>
        <div class="form-group">
          <label class="form-label">Shop/Office Address</label>
          <input type="text" id="address" class="form-input" placeholder="e.g. Main Bazar, Lahore">
        </div>
      </div>

      <!-- Business Hours Section -->
      <div class="form-section">
        <div class="section-title">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          Business Hours
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Opening Time</label>
            <input type="time" id="openTime" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Closing Time</label>
            <input type="time" id="closeTime" class="form-input">
          </div>
        </div>
      </div>

      <button type="submit" id="saveBtn" class="save-btn">Save Contact Info</button>
      <div id="msg" class="msg-box"></div>

    </form>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/auth.js"></script>

  <script>
    (async function () {
      try {
        if (typeof db === 'undefined' || !db?.auth) {
          window.location.replace('../../index.html');
          return;
        }
        if (typeof requireLogin !== 'function') {
          window.location.replace('../../index.html');
          return;
        }
        const session = await requireLogin();
        if (!session) return;

        document.body.style.visibility = 'visible';

        // Load Sidebar
        function loadScript(src, attributes = {}) {
          return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            Object.entries(attributes).forEach(([key, value]) => {
              script.setAttribute(key, value);
            });
            script.onload = resolve;
            script.onerror = () => reject(new Error('Script load failed: ' + src));
            document.body.appendChild(script);
          });
        }

        await loadScript('../../js/sidebar.js', {
          'data-root': '../../',
          'data-active': 'website'
        });

        setTimeout(() => {
            const oldMenuBtn = document.getElementById('menuBtn');
            const container = document.getElementById('sidebar-toggle-container');
            if (oldMenuBtn && container) {
                container.appendChild(oldMenuBtn);
            }
        }, 100);

        // ==== Settings Logic ====
        const form = document.getElementById('contactForm');
        const msg = document.getElementById('msg');
        const saveBtn = document.getElementById('saveBtn');

        // Load Current Settings
        async function loadSettings() {
          const { data, error } = await db.from('store_settings').select('setting_key, setting_value');
          if (error) { console.error(error); return; }
          
          const settings = {};
          if (data) data.forEach(item => { settings[item.setting_key] = item.setting_value; });

          document.getElementById('primaryPhone').value = settings['primary_phone'] || '';
          document.getElementById('secondaryPhone').value = settings['secondary_phone'] || '';
          document.getElementById('landline').value = settings['landline'] || '';
          document.getElementById('waNumber').value = settings['wa_number'] || '';
          document.getElementById('waMessage').value = settings['wa_message'] || '';
          document.getElementById('email').value = settings['email'] || '';
          document.getElementById('address').value = settings['address'] || '';
          document.getElementById('openTime').value = settings['open_time'] || '';
          document.getElementById('closeTime').value = settings['close_time'] || '';
        }

        // Save Settings
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          saveBtn.disabled = true;
          msg.style.color = '#666';
          msg.innerText = 'Saving...';

          const settingsData = [
            { setting_key: 'primary_phone', setting_value: document.getElementById('primaryPhone').value },
            { setting_key: 'secondary_phone', setting_value: document.getElementById('secondaryPhone').value },
            { setting_key: 'landline', setting_value: document.getElementById('landline').value },
            { setting_key: 'wa_number', setting_value: document.getElementById('waNumber').value },
            { setting_key: 'wa_message', setting_value: document.getElementById('waMessage').value },
            { setting_key: 'email', setting_value: document.getElementById('email').value },
            { setting_key: 'address', setting_value: document.getElementById('address').value },
            { setting_key: 'open_time', setting_value: document.getElementById('openTime').value },
            { setting_key: 'close_time', setting_value: document.getElementById('closeTime').value }
          ];

          const { error } = await db.from('store_settings').upsert(settingsData, { onConflict: 'setting_key' });

          if (error) {
            msg.style.color = 'red';
            msg.innerText = 'Error: ' + error.message;
          } else {
            msg.style.color = 'green';
            msg.innerText = 'Settings saved successfully!';
          }
          saveBtn.disabled = false;
        });

        loadSettings();

      } catch (error) {
        console.error('Contact Information security check failed:', error);
        window.location.replace('../../index.html');
      }
    })();
  </script>
</body>
</html>
