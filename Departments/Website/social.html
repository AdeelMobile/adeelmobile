<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Media Links - Adeel Mobile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/layout.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      visibility: hidden;
      font-family: 'Roboto', sans-serif;
      background-color: #F8F9FA;
      color: #111;
      -webkit-font-smoothing: antialiased;
    }

    .topbar, .app-header { display: none !important; }

    /* Top Bar */
    .custom-top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: #fff;
      border-bottom: 1px solid #E5E7EB; gap: 10px; z-index: 100;
    }

    .left-section { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

    .back-btn {
        display: flex; align-items: center; justify-content: center;
        width: 40px; height: 40px;
        background: #fff; border: 1px solid #E5E7EB; 
        border-radius: 10px; cursor: pointer; color: #111; flex-shrink: 0;
        text-decoration: none; font-size: 20px;
    }
    .back-btn:hover { background: #F3F4F6; }

    .title-area {
      font-family: 'Inter', sans-serif; 
      font-size: 20px;
      font-weight: 700; 
      color: #111; 
      white-space: nowrap;
      overflow: hidden; 
      text-overflow: ellipsis;
    }

    /* Main Layout */
    .page { 
      padding: 85px 16px 40px; 
      max-width: 720px; margin: auto; min-height: 100vh; 
    }

    /* Header Box (Grey) */
    .header-box {
      background: #E5E7EB;
      color: #111111;
      border-radius: 12px;
      padding: 20px 16px;
      margin-bottom: 20px;
    }
    
    .header-box .title-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }

    .header-box svg { width: 28px; height: 28px; stroke: #111; }
    
    .header-box h1 {
      font-family: 'Inter', sans-serif;
      font-size: 24px; font-weight: 700; letter-spacing: -0.5px; color: #111;
    }

    .header-box p {
      font-size: 14px; color: #555555; font-weight: 400;
      margin-left: 38px; 
    }

    /* Form Styling */
    .form-container {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 14px;
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .form-label svg { width: 18px; height: 18px; }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #D1D5DB;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Roboto', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      background: #F9FAFB;
    }

    .form-input:focus {
      border-color: #111;
      background: #FFF;
    }

    /* Save Button */
    .save-btn {
      width: 100%;
      padding: 16px;
      background: #1C1C1C;
      color: #FFF;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .save-btn:hover { background: #333; }
    .save-btn:disabled { background: #999; cursor: not-allowed; }

    .msg-box {
      text-align: center; margin-top: 15px; font-size: 14px; font-weight: 500;
    }

  </style>
</head>
<body>

  <header class="custom-top-bar">
    <div class="left-section">
      <a href="settings.html" class="back-btn">←</a>
      <div class="title-area">Website Settings</div>
    </div>
  </header>

  <main id="page-content" class="page">
    
    <!-- Grey Header -->
    <div class="header-box">
      <div class="title-row">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        <h1>Social Media Links</h1>
      </div>
      <p>Add your social media profile links</p>
    </div>

    <form id="socialForm" class="form-container">
      
      <div class="form-group">
        <label class="form-label">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
          Facebook Page Link
        </label>
        <input type="url" id="facebookLink" class="form-input" placeholder="https://facebook.com/yourpage">
      </div>

      <div class="form-group">
        <label class="form-label">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
          Instagram Profile Link
        </label>
        <input type="url" id="instaLink" class="form-input" placeholder="https://instagram.com/yourprofile">
      </div>

      <div class="form-group">
        <label class="form-label">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path></svg>
          TikTok Profile Link
        </label>
        <input type="url" id="tiktokLink" class="form-input" placeholder="https://tiktok.com/@yourprofile">
      </div>

      <div class="form-group">
        <label class="form-label">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
          YouTube Channel Link
        </label>
        <input type="url" id="youtubeLink" class="form-input" placeholder="https://youtube.com/yourchannel">
      </div>

      <div class="form-group">
        <label class="form-label">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          Other Social Link (Optional)
        </label>
        <input type="url" id="otherLink" class="form-input" placeholder="https://...">
      </div>

      <button type="submit" id="saveBtn" class="save-btn">Save Social Links</button>
      <div id="msg" class="msg-box"></div>

    </form>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/auth.js"></script>

  <script>
    (async function () {
      try {
        if (typeof db === 'undefined' || !db?.auth) {
          window.location.replace('../../index.html');
          return;
        }
        if (typeof requireLogin !== 'function') {
          window.location.replace('../../index.html');
          return;
        }
        const session = await requireLogin();
        if (!session) return;

        document.body.style.visibility = 'visible';

        // Load Sidebar
        function loadScript(src, attributes = {}) {
          return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            Object.entries(attributes).forEach(([key, value]) => {
              script.setAttribute(key, value);
            });
            script.onload = resolve;
            script.onerror = () => reject(new Error('Script load failed: ' + src));
            document.body.appendChild(script);
          });
        }

        await loadScript('../../js/sidebar.js', {
          'data-root': '../../',
          'data-active': 'website'
        });

        setTimeout(() => {
            const oldMenuBtn = document.getElementById('menuBtn');
            const container = document.getElementById('sidebar-toggle-container');
            if (oldMenuBtn && container) {
                container.appendChild(oldMenuBtn);
            }
        }, 100);

        // ==== Settings Logic ====
        const form = document.getElementById('socialForm');
        const msg = document.getElementById('msg');
        const saveBtn = document.getElementById('saveBtn');

        // Load Current Settings
        async function loadSettings() {
          const { data, error } = await db.from('store_settings').select('setting_key, setting_value');
          if (error) { console.error(error); return; }
          
          const settings = {};
          if (data) data.forEach(item => { settings[item.setting_key] = item.setting_value; });

          document.getElementById('facebookLink').value = settings['facebook_link'] || '';
          document.getElementById('instaLink').value = settings['instagram_link'] || '';
          document.getElementById('tiktokLink').value = settings['tiktok_link'] || '';
          document.getElementById('youtubeLink').value = settings['youtube_link'] || '';
          document.getElementById('otherLink').value = settings['other_social_link'] || '';
        }

        // Save Settings
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          saveBtn.disabled = true;
          msg.style.color = '#666';
          msg.innerText = 'Saving...';

          const settingsData = [
            { setting_key: 'facebook_link', setting_value: document.getElementById('facebookLink').value },
            { setting_key: 'instagram_link', setting_value: document.getElementById('instaLink').value },
            { setting_key: 'tiktok_link', setting_value: document.getElementById('tiktokLink').value },
            { setting_key: 'youtube_link', setting_value: document.getElementById('youtubeLink').value },
            { setting_key: 'other_social_link', setting_value: document.getElementById('otherLink').value }
          ];

          const { error } = await db.from('store_settings').upsert(settingsData, { onConflict: 'setting_key' });

          if (error) {
            msg.style.color = 'red';
            msg.innerText = 'Error: ' + error.message;
          } else {
            msg.style.color = 'green';
            msg.innerText = 'Social links saved successfully!';
          }
          saveBtn.disabled = false;
        });

        loadSettings();

      } catch (error) {
        console.error('Social Media Links security check failed:', error);
        window.location.replace('../../index.html');
      }
    })();
  </script>
</body>
</html>
