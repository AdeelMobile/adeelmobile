<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Status - Adeel Mobile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/layout.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      visibility: hidden;
      font-family: 'Roboto', sans-serif;
      background-color: #F8F9FA;
      color: #111;
      -webkit-font-smoothing: antialiased;
    }

    .topbar, .app-header { display: none !important; }

    /* Top Bar */
    .custom-top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: #fff;
      border-bottom: 1px solid #E5E7EB; gap: 10px; z-index: 100;
    }

    .left-section { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

    .back-btn {
        display: flex; align-items: center; justify-content: center;
        width: 40px; height: 40px;
        background: #fff; border: 1px solid #E5E7EB; 
        border-radius: 10px; cursor: pointer; color: #111; flex-shrink: 0;
        text-decoration: none; font-size: 20px;
    }
    .back-btn:hover { background: #F3F4F6; }

    .title-area {
      font-family: 'Inter', sans-serif; 
      font-size: 20px;
      font-weight: 700; 
      color: #111; 
      white-space: nowrap;
      overflow: hidden; 
      text-overflow: ellipsis;
    }

    /* Main Layout */
    .page { 
      padding: 85px 16px 40px; 
      max-width: 720px; margin: auto; min-height: 100vh; 
    }

    /* Header Box (Grey) */
    .header-box {
      background: #E5E7EB;
      color: #111111;
      border-radius: 12px;
      padding: 20px 16px;
      margin-bottom: 20px;
    }
    
    .header-box .title-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }

    .header-box svg { width: 28px; height: 28px; stroke: #111; }
    
    .header-box h1 {
      font-family: 'Inter', sans-serif;
      font-size: 24px; font-weight: 700; letter-spacing: -0.5px; color: #111;
    }

    .header-box p {
      font-size: 14px; color: #555555; font-weight: 400;
      margin-left: 38px; 
    }

    /* Form Styling */
    .form-container {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 14px;
      padding: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: #111;
      margin-bottom: 12px;
    }

    /* Radio Options */
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border: 1px solid #E5E7EB;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #F9FAFB;
    }

    .radio-option:hover {
      border-color: #999;
    }

    .radio-option input[type="radio"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #1C1C1C;
    }

    .radio-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .radio-title {
      font-weight: 600;
      font-size: 15px;
      color: #111;
    }

    .radio-desc {
      font-size: 13px;
      color: #6B7280;
      font-weight: 400;
    }

    /* Save Button */
    .save-btn {
      width: 100%;
      padding: 16px;
      background: #1C1C1C;
      color: #FFF;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .save-btn:hover { background: #333; }
    .save-btn:disabled { background: #999; cursor: not-allowed; }

    .msg-box {
      text-align: center; margin-top: 15px; font-size: 14px; font-weight: 500;
    }

  </style>
</head>
<body>

  <header class="custom-top-bar">
    <div class="left-section">
      <a href="settings.html" class="back-btn">←</a>
      <div class="title-area">Website Settings</div>
    </div>
  </header>

  <main id="page-content" class="page">
    
    <!-- Grey Header -->
    <div class="header-box">
      <div class="title-row">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
        <h1>Website Status</h1>
      </div>
      <p>Control whether your website is live or in maintenance</p>
    </div>

    <form id="statusForm" class="form-container">
      
      <div class="form-group">
        <label class="form-label">Select Website Status</label>
        <div class="radio-group">
          
          <label class="radio-option">
            <input type="radio" name="websiteStatus" value="active" id="statusActive">
            <div class="radio-text">
              <span class="radio-title">Active (Live)</span>
              <span class="radio-desc">Customers can visit and shop normally</span>
            </div>
          </label>

          <label class="radio-option">
            <input type="radio" name="websiteStatus" value="maintenance" id="statusMaintenance">
            <div class="radio-text">
              <span class="radio-title">Maintenance Mode</span>
              <span class="radio-desc">Website will show a "Be right back" page</span>
            </div>
          </label>

        </div>
      </div>

      <button type="submit" id="saveBtn" class="save-btn">Save Status</button>
      <div id="msg" class="msg-box"></div>

    </form>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/auth.js"></script>

  <script>
    (async function () {
      try {
        if (typeof db === 'undefined' || !db?.auth) {
          window.location.replace('../../index.html');
          return;
        }
        if (typeof requireLogin !== 'function') {
          window.location.replace('../../index.html');
          return;
        }
        const session = await requireLogin();
        if (!session) return;

        document.body.style.visibility = 'visible';

        // Load Sidebar
        function loadScript(src, attributes = {}) {
          return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            Object.entries(attributes).forEach(([key, value]) => {
              script.setAttribute(key, value);
            });
            script.onload = resolve;
            script.onerror = () => reject(new Error('Script load failed: ' + src));
            document.body.appendChild(script);
          });
        }

        await loadScript('../../js/sidebar.js', {
          'data-root': '../../',
          'data-active': 'website'
        });

        setTimeout(() => {
            const oldMenuBtn = document.getElementById('menuBtn');
            const container = document.getElementById('sidebar-toggle-container');
            if (oldMenuBtn && container) {
                container.appendChild(oldMenuBtn);
            }
        }, 100);

        // ==== Settings Logic ====
        const form = document.getElementById('statusForm');
        const msg = document.getElementById('msg');
        const saveBtn = document.getElementById('saveBtn');

        // Load Current Status
        async function loadStatus() {
          const { data, error } = await db.from('store_settings').select('setting_value').eq('setting_key', 'website_status').single();
          if (error || !data) {
            document.getElementById('statusActive').checked = true;
            return;
          }
          
          if (data.setting_value === 'maintenance') {
            document.getElementById('statusMaintenance').checked = true;
          } else {
            document.getElementById('statusActive').checked = true;
          }
        }

        // Save Status
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          saveBtn.disabled = true;
          msg.style.color = '#666';
          msg.innerText = 'Saving...';

          const selectedStatus = document.querySelector('input[name="websiteStatus"]:checked').value;

          const { error } = await db.from('store_settings').upsert({
            setting_key: 'website_status',
            setting_value: selectedStatus
          }, { onConflict: 'setting_key' });

          if (error) {
            msg.style.color = 'red';
            msg.innerText = 'Error: ' + error.message;
          } else {
            msg.style.color = 'green';
            msg.innerText = 'Website status updated!';
          }
          saveBtn.disabled = false;
        });

        loadStatus();

      } catch (error) {
        console.error('Website Status security check failed:', error);
        window.location.replace('../../index.html');
      }
    })();
  </script>
</body>
</html>
