<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test - Main Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #F8F9FA;
      color: #111;
    }

    .page { padding: 20px 16px 40px; max-width: 600px; margin: auto; }

    .title { font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 20px; }

    /* Department Card Styling */
    .department-box {
      background: #fff;
      border: 1px solid #e1e5eb;
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .department-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .department-header:hover { background: #f9f9f9; }

    .department-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 600;
    }

    .icon-header {
      width: 40px;
      height: 40px;
      background: #f0f0f0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .arrow {
      font-size: 14px;
      color: #666;
      transition: transform 0.3s ease;
    }

    /* Expandable Content (Grid - 3 Columns) */
    .department-content {
      display: none; 
      padding: 0 18px 18px 18px;
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px; 
    }

    .department-content.open {
      display: grid; 
    }

    /* Sub Buttons (Image wala Design) */
    .sub-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #E8E8E8; 
      border: 1px solid #E0E0E0;
      padding: 14px 6px; 
      border-radius: 10px;
      text-decoration: none;
      color: #111;
      font-family: 'Inter', sans-serif;
      font-size: 13px; 
      font-weight: 700;
      transition: background 0.2s;
      text-align: center;
    }
    
    .sub-btn:hover {
      background: #DCDCDC; 
    }

    /* Emojis / Icons */
    .sub-btn-icon {
      font-size: 24px; 
      display: flex;
      align-items: center;
      justify-content: center;
      height: 30px;
    }

    /* Arrow Rotate */
    .department-box.active .arrow {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>

  <main class="page">
    <h2 class="title">Departments</h2>

    <!-- 1. Installments Department -->
    <div class="department-box">
      <div class="department-header" onclick="toggleAccordion(this)">
        <div class="department-title">
          <div class="icon-header">💵</div> Installments
        </div>
        <div class="arrow">▼</div>
      </div>
      
      <div class="department-content">
        <!-- Users ka link update -->
        <a href="test-users-page.html" class="sub-btn"><span class="sub-btn-icon">👥</span> Users</a>
        <a href="#" class="sub-btn"><span class="sub-btn-icon">🧑‍💼</span> Customers</a>
        <a href="#" class="sub-btn"><span class="sub-btn-icon">📋</span> Plans</a>
        <a href="#" class="sub-btn"><span class="sub-btn-icon">✔️</span> Verifications</a>
        <a href="#" class="sub-btn"><span class="sub-btn-icon">💼</span> Wallet</a>
        <a href="#" class="sub-btn"><span class="sub-btn-icon">📊</span> Sales</a>
      </div>
    </div>

    <!-- 2. Website Department -->
    <div class="department-box">
      <div class="department-header" onclick="toggleAccordion(this)">
        <div class="department-title">
          <div class="icon-header">🌐</div> Website
        </div>
        <div class="arrow">▼</div>
      </div>
      
      <div class="department-content">
        <a href="#" class="sub-btn"><span class="sub-btn-icon">🖥️</span> Control</a>
        <a href="#" class="sub-btn"><span class="sub-btn-icon">⚙️</span> Settings</a>
      </div>
    </div>

    <!-- 3. Social Media Department -->
    <div class="department-box">
      <div class="department-header" onclick="toggleAccordion(this)">
        <div class="department-title">
          <div class="icon-header">📱</div> Social Media
        </div>
        <div class="arrow">▼</div>
      </div>
      
      <div class="department-content">
        <a href="#" class="sub-btn"><span class="sub-btn-icon">🖼️</span> Poster</a>
        <a href="#" class="sub-btn"><span class="sub-btn-icon">🤖</span> Automation</a>
      </div>
    </div>

    <!-- 4. Database Department -->
    <div class="department-box">
      <div class="department-header" onclick="toggleAccordion(this)">
        <div class="department-title">
          <div class="icon-header">🗄️</div> Database
        </div>
        <div class="arrow">▼</div>
      </div>
      
      <div class="department-content">
        <a href="#" class="sub-btn"><span class="sub-btn-icon">📱</span> Products</a>
        <a href="#" class="sub-btn"><span class="sub-btn-icon">🏷️</span> Brands</a>
      </div>
    </div>

  </main>

  <script>
    function toggleAccordion(element) {
      const box = element.parentElement;
      const content = box.querySelector('.department-content');
      box.classList.toggle('active');
      content.classList.toggle('open');
    }
  </script>
</body>
</html>
